<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Zainab ❤️</title>

<style>
:root{
  --pink1:#ff9a9e;
  --pink2:#fad0c4;
  --glass:rgba(255,255,255,.22);
  --stroke:rgba(255,255,255,.35);
  --txt:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,var(--pink1),var(--pink2));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--txt);
  overflow:hidden;
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-30px;
  animation:float 6s linear forwards;
  opacity:.8;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0}
}

/* card */
.card{
  width:92%;
  max-width:420px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--stroke);
  border-radius:26px;
  padding:22px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:13px;
  opacity:.9;
}

.music{
  padding:8px 12px;
  border-radius:20px;
  border:1px solid var(--stroke);
  cursor:pointer;
}

h1{
  margin:6px 0 6px;
  font-size:28px;
}
.subtitle{
  font-size:14px;
  opacity:.9;
  margin-bottom:14px;
}

.stage{
  background:rgba(255,255,255,.18);
  border:1px solid var(--stroke);
  border-radius:22px;
  padding:18px 16px;
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:fadeIn .4s ease;
}

.emoji{
  font-size:44px;
  margin-bottom:6px;
}
.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}
.text{
  font-size:15px;
  line-height:1.65;
  white-space:pre-line;
}

.hint{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.85;
}

button{
  margin-top:14px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  background:#fff;
  color:#ff4f7a;
}

/* overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.overlayCard{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:26px;
  padding:26px;
  text-align:center;
  max-width:420px;
  width:90%;
}
.overlayCard h2{margin:8px 0 10px}
.overlayCard p{font-size:14px;line-height:1.6;opacity:.95}

audio{display:none}
</style>
</head>

<body>

<div class="overlay" id="overlay">
  <div class="overlayCard">
    <div style="font-size:48px">💝</div>
    <h2>For Zainab</h2>
    <p>
      I didn’t want to just say something sweet.<br>
      I wanted to *make* something — just for you.
    </p>
    <button id="startBtn">Start ❤️</button>
  </div>
</div>

<div class="card" id="card">
  <div class="top">
    <div>Swipe for messages</div>
    <div class="music" id="musicBtn">🎵 Off</div>
  </div>

  <h1>Zainab 🌷</h1>
  <div class="subtitle">
    Happy Valentine’s Day. I hope this stays with you.
  </div>

  <div class="stage" id="stage">
    <div class="emoji" id="emoji">💖</div>
    <div class="title" id="title">A small beginning</div>
    <div class="text" id="text">
      Swipe when you’re ready.
    </div>
  </div>

  <div class="hint">
    <span>⬅ Swipe</span>
    <span>Swipe ➡</span>
  </div>
</div>

<audio id="bgm" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💗","💖","✨","🌸"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(14+Math.random()*22)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},450);

/* slides */
const slides=[
{
 e:"🧸",
 t:"Comfort",
 m:"Zainab,\nYou feel like calm in a loud world.\nLike the place my mind rests."
},
{
 e:"🌙",
 t:"Quiet care",
 m:"You don’t do big things to impress.\nYou do small things that *matter*.\nThat’s what makes you special."
},
{
 e:"🌸",
 t:"Your presence",
 m:"Some people are beautiful to look at.\nSome are beautiful to know.\nYou’re both."
},
{
 e:"💌",
 t:"Truth",
 m:"I don’t know what the future holds.\nBut I know who I’d choose to walk through it with."
},
{
 e:"🕊️",
 t:"From me to you",
 m:"If this world ever feels heavy,\nI hope you remember:\nYou are deeply valued.\nYou are deeply loved."
}
];

let i=0;
const emoji=document.getElementById("emoji");
const title=document.getElementById("title");
const text=document.getElementById("text");
const stage=document.getElementById("stage");

function show(idx){
 const s=slides[idx];
 emoji.textContent=s.e;
 title.textContent=s.t;
 text.textContent=s.m;
 stage.style.animation="none";
 stage.offsetHeight;
 stage.style.animation="fadeIn .4s ease";
}

/* swipe */
let startX=0;
stage.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
stage.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-startX;
 if(Math.abs(dx)<40)return;
 i=(dx<0)?(i+1)%slides.length:(i-1+slides.length)%slides.length;
 show(i);
});
stage.addEventListener("click",()=>{i=(i+1)%slides.length;show(i)});

/* music */
const bgm=document.getElementById("bgm");
const musicBtn=document.getElementById("musicBtn");
let playing=false;

musicBtn.onclick=async()=>{
 try{
  if(!playing){await bgm.play();playing=true;musicBtn.textContent="🎵 On";}
  else{bgm.pause();playing=false;musicBtn.textContent="🎵 Off";}
 }catch(e){}
};

/* start */
document.getElementById("startBtn").onclick=async()=>{
 document.getElementById("overlay").style.display="none";
 show(0);
 try{
  await bgm.play();
  playing=true;
  musicBtn.textContent="🎵 On";
 }catch(e){}
};
</script>

</body>
</html>
